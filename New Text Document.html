      background-color: #000;
      color: #fff;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 0;
    }

    h1 {
      text-align: center;
      color: #b87333;
      margin: 30px 0 10px;
      font-size: 36px;
      border-bottom: 2px solid #b87333;
      display: inline-block;
    }

    p {
      text-align: center;
      font-size: 18px;
      color: #ccc;
      margin-bottom: 30px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
      padding: 20px;
    }

    .gallery a {
      border: 2px solid #b87333;
      display: block;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .gallery a:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px red;
    }

    .gallery img {
      width: 200px;
      height: auto;
      display: block;
    }

    .whatsapp-button {
      display: block;
      width: max-content;
      margin: 0 auto 40px;
      padding: 10px 20px;
      background-color: #25d366;
      color: #000;
      font-weight: bold;
      border-radius: 8px;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 0 10px #25d366;
      transition: background-color 0.3s, color 0.3s;
    }

    .whatsapp-button:hover {
      background-color: #1ebe5d;
      color: #fff;
    }

    .footer {
      background-color: #111;
      color: #aaa;
      text-align: center;
      padding: 20px 10px;
      font-size: 14px;
      border-top: 1px solid #333;
    }

    .footer a {
      color: #b87333;
      text-decoration: none;
      margin: 0 5px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .instagram-follow {
      text-align: center;
      margin: 40px auto 20px;
    }

    .instagram-follow a {
      color: #fff;
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      padding: 10px 25px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      transition: opacity 0.3s;
    }

    .instagram-follow a:hover {
      opacity: 0.8;
    }
  </style>
